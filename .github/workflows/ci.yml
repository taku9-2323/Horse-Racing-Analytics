name: CI and release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify and package
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: backend/.python-version

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: python -m pip install --disable-pip-version-check -e ".[dev]"
        timeout-minutes: 10

      - name: Type-check backend
        working-directory: backend
        run: python -m mypy app
        timeout-minutes: 5

      - name: Test backend
        working-directory: backend
        run: python -m pytest -p no:cacheprovider
        timeout-minutes: 5

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund
        timeout-minutes: 10

      - name: Type-check frontend
        working-directory: frontend
        run: npm run typecheck
        timeout-minutes: 5

      - name: Test frontend
        working-directory: frontend
        run: npm run test
        timeout-minutes: 5

      - name: Build frontend
        working-directory: frontend
        run: npm run build
        timeout-minutes: 5

      - name: Package source and built frontend
        env:
          PACKAGE_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || format('build-{0}', github.sha) }}
          SOURCE_SHA: ${{ github.sha }}
        run: >-
          python scripts/package_release.py
          --version "$PACKAGE_VERSION"
          --source-sha "$SOURCE_SHA"
          --output-directory dist

      - name: Upload verified package
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: package-${{ github.sha }}
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish tagged release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out tag history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Require the tag to be on main
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD

      - name: Download verified package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: package-${{ github.sha }}
          path: release

      - name: Verify package checksum
        working-directory: release
        run: sha256sum --check ./*.sha256

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          release/*.zip release/*.sha256
          --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
